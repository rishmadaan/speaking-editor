name: Release

# Cut a GitHub release when a semver tag is pushed (e.g. `git tag 0.2.0 && git push
# origin 0.2.0`). The tag name is the release version and must match manifest.json.
# The three built artifacts (main.js, manifest.json, styles.css) are attached to the
# release: those are exactly the files a user drops into
# <vault>/.obsidian/plugins/speaking-editor/, and the files the Obsidian community
# updater fetches. Legal notices and corresponding source accompany those assets.
on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npx vitest run

      - name: Typecheck
        run: npx tsc -p tsconfig.json --noEmit

      - name: Build (production)
        run: node build.mjs --prod

      - name: Verify the dev-only acceptance harness is stripped
        run: |
          if grep -q "runAcceptance" dist/main.js; then
            echo "prod bundle still contains the acceptance harness (runAcceptance)"; exit 1
          fi
          echo "acceptance harness absent from prod bundle"

      - name: Verify legal materials and package corresponding source
        run: node scripts/package-source.mjs

      - name: Rebuild from the source archive
        run: |
          source_check="$(mktemp -d)"
          tar -xzf "dist/speaking-editor-${GITHUB_REF_NAME}-source.tar.gz" -C "$source_check"
          cd "$source_check/speaking-editor-${GITHUB_REF_NAME}"
          npm ci
          npx vitest run
          npx tsc -p tsconfig.json --noEmit
          node build.mjs --prod
          node scripts/verify-release.mjs

      - name: Create release with plugin assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file dist/release-notes.md \
            --generate-notes \
            dist/main.js dist/manifest.json dist/styles.css \
            dist/LICENSE dist/LICENSE-NOTICE.md dist/LICENSE-EXCEPTION.md \
            dist/THIRD_PARTY_NOTICES.md "dist/speaking-editor-${TAG}-source.tar.gz"

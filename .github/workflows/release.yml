name: Release

# Cut a GitHub release when a semver tag is pushed (e.g. `git tag 0.2.0 && git push
# origin 0.2.0`). The tag name is the release version and must match manifest.json.
# The three built artifacts (main.js, manifest.json, styles.css) are attached to the
# release: those are exactly the files a user drops into
# <vault>/.obsidian/plugins/speaking-editor/, and the files the Obsidian community
# updater fetches.
on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npx vitest run

      - name: Typecheck
        run: npx tsc -p tsconfig.json --noEmit

      - name: Build (production)
        run: node build.mjs --prod

      - name: Verify the dev-only acceptance harness is stripped
        run: |
          if grep -q "runAcceptance" dist/main.js; then
            echo "prod bundle still contains the acceptance harness (runAcceptance)"; exit 1
          fi
          echo "acceptance harness absent from prod bundle"

      - name: Create release with plugin assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            dist/main.js dist/manifest.json dist/styles.css
